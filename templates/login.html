<!doctype html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.145.0">
    <title>Taskie - Вход</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sign-in/">

    <script src="{{url_for('assets', path='js/color-modes.js')}}"></script>

    <link href="{{url_for('assets', path='dist/css/bootstrap.min.css')}}" rel="stylesheet">
    
    <link rel="apple-touch-icon" href="{{url_for('assets', path='img/favicons/apple-touch-icon.png')}}" sizes="180x180">
<link rel="icon" href="{{url_for('assets', path='img/favicons/favicon-32x32.png')}}" sizes="32x32" type="image/png">
<link rel="icon" href="{{url_for('assets', path='img/favicons/favicon-16x16.png')}}" sizes="16x16" type="image/png">
<link rel="manifest" href="{{url_for('assets', path='img/favicons/manifest.json')}}">
<link rel="mask-icon" href="{{url_for('assets', path='img/favicons/safari-pinned-tab.svg')}}" color="#712cf9">
<link rel="icon" href="{{url_for('assets', path='img/favicons/favicon.ico')}}">
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<meta name="theme-color" content="#712cf9">


<main class="form-signin w-100 m-auto">
  <form id="loginForm">
    <img class="mb-4" src="{{url_for('assets', path='img/logo.png')}}" alt="" width="72">
    <h1 class="h3 mb-3 fw-normal">Вход в Taskie</h1>

    <div class="form-floating">
      <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" name="email" required>
      <label for="floatingInput">Почта</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" id="floatingPassword" placeholder="Password" name="password" required>
      <label for="floatingPassword">Пароль</label>
    </div>
    <button class="btn btn-primary w-100 py-2 mb-3" type="submit">Войти</button>
    <a href="/register" class="btn btn-primary w-100 py-2 mb-3" role="button">Создать аккаунт</a>
    <a href="/" class="btn btn-primary w-100 py-2" role="button">Вернуться на главную</a>
  </form>
  <script>
    $(document).ready(function () {                
        $('#loginForm').submit(function (event) {
            event.preventDefault();                
            var form = document.getElementById('loginForm');
            var formData = new FormData(form);
         
            $.ajax({
                url: '/api/login',
                method: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function (response) {                      
                    window.location.href = window.location.origin + '/account/';
                },
                error: function (xhr, status, error) {                       
                    alert('Не удалось войти в учётную запись');
                    console.error(error);
                }
            });
        });
    });
</script>
</main>
<script defer src="{{url_for('assets', path='dist/js/bootstrap.bundle.min.js')}}" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"></script>

    </body>
</html>
