{% extends "base.html" %}

{% block header %}
<style>
  .video {
    overflow: hidden;
    margin-top:10px;
    padding-top: 56.25%;
    position: relative;
    }
  
  .video iframe {
    position: absolute;
    top: 0;
    left: 0;
    border: 0;
    width: 100%;
    height: 100%;
  }
  </style>
{% endblock %}

{% block body %}
<div class="p-5 mb-4 bg-body-tertiary rounded-3" style="background-image:linear-gradient(to right,rgba(0, 0, 0, 1), rgba(0, 0, 0, 0.601)), url({{cover}});background-repeat: no-repeat; background-size: cover;">
  <div class="container-fluid py-5">
    <h1 class="display-5 fw-bold" style="color:white;">{{title}}</h1>
    <p class="col-md-8 fs-4" style="color:white;">{{description}}</p>
    {% for url in additional_links %}
        <a href="{{url}}"><button class="btn btn-primary btn-lg" type="button">Ссылка {{loop.index}}</button></a>
    {% endfor %}
    <a href="/account/tasks/{{project_id}}"><button class="btn btn-primary btn-lg" type="button">Перейти к задачам</button></a>
  </div>
</div>

<div class="row align-items-md-stretch">
  <div class="col-md-6">
    <div class="h-100 text-bg-dark rounded-3">
        <div class="video"></div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="h-100 p-5 bg-body-tertiary border rounded-3">
      <h2>Участники проекта:</h2>
      <p>{% for author in authors %} @{{author}} {% endfor %}</p>
      <br>
      <h2>Теги:</h2>
      <p>{% for tag in tags %} #{{tag}} {% endfor %}</p>
      <a href="/user/{{author_id}}" target="_blank"><button class="btn btn-outline-secondary" type="button">Перейти в профиль создателя</button></a>
    </div>
  </div>
</div>

<script defer src="{{url_for('assets', path='dist/js/bootstrap.bundle.min.js')}}" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"></script>
<script>
window.onload = function() {
    $('.video').html('<iframe src="{{video_url}}" frameBorder="0" allow="clipboard-write; autoplay" webkitAllowFullScreen mozallowfullscreen allowFullScreen></iframe>');
  };
</script>
{% endblock %}
