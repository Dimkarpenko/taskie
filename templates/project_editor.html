{% extends "base.html" %}

{% block body %}
<h3>Новый проект</h3>
<form id="projectForm" class="mt-3 mb-3" method="POST" action="/api/new_project"  enctype="multipart/form-data">
  <input type="hidden" value="{{user_id}}" name="author_id">
  <div class="input-group mb-3">
    <span class="input-group-text" id="placeholder-1">Название</span>
    <input type="text" class="form-control" aria-label="Sizing example input" name="title" aria-describedby="placeholder-1" required>
  </div>

  <div class="input-group mb-3">
    <span class="input-group-text" id="placeholder-2">Описание</span>
    <input type="text" class="form-control" aria-label="Sizing example input" name="description" aria-describedby="placeholder-2" required>
  </div>

  <div class="input-group mb-3">
    <span class="input-group-text" id="placeholder-3">Теги</span>
    <input type="text" class="form-control" aria-label="Sizing example input" name="tags" aria-describedby="placeholder-3" required>
  </div>

  <div class="input-group mb-3">
    <span class="input-group-text" id="placeholder-4">Участники</span>
    <input type="text" class="form-control" aria-label="Sizing example input" name="users" aria-describedby="placeholder-4" required>
  </div>

  <div class="input-group mb-3">
    <label class="input-group-text" for="inputGroupFile01">Обложка</label>
    <input type="file" class="form-control" id="inputGroupFile01" name="files" required>
  </div>

  <div class="input-group mb-3">
    <span class="input-group-text" id="basic-addon3">Видео-демонстрация (RuTube)</span>
    <input type="text" class="form-control" id="basic-url" aria-describedby="basic-addon3" name="video_url" required>
  </div>
  
  <div class="input-group mb-3">
    <span class="input-group-text">Дополнительные ссылки</span>
    <input type="text" aria-label="First name" class="form-control" name="link_1" required>
    <input type="text" aria-label="Last name" class="form-control" name="link_2" required>
  </div>

  <button class="btn btn-primary w-100 py-2" type="submit">Отправить</button>
</form>
{% endblock body %}
